name: CI

on:
  push:
    branches:
      - master
    
jobs:
  build:
    runs-on: ubuntu-latest

    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: npm ci

    - name: Package VSIX
      run: npx vsce package
    - uses: actions/upload-artifact@v4
      with:
        name: VSIX
        path: "*.vsix"

